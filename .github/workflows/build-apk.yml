name: Build DIVA APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile DIVA debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          echo "$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Build legacy native library
        working-directory: app/src/main/jni
        run: |
          "$ANDROID_HOME/ndk/25.2.9519653/ndk-build"
          mkdir -p ../jniLibs
          if [ -d ../libs ]; then
            cp -R ../libs/. ../jniLibs/
          fi
          test -n "$(find ../jniLibs -name 'libdivajni.so' -print -quit)"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DIVA-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
